<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ร้าน Witch yu - จองคิวดูดวงพยากรณ์</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
    <script src="https://npmcdn.com/flatpickr/dist/l10n/th.js"></script>
    <style>
        body { font-family: 'Prompt', sans-serif; }
        .theme-bg {
            background-color: #1a0b2e;
            background-image: radial-gradient(circle at 50% 20%, #2e1046 0%, #1a0b2e 70%, #0d041a 100%);
        }
        .gold-text { color: #fde047; }
        .gold-gradient-text {
            background: linear-gradient(to right, #fef08a, #fde047, #ca8a04);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .gold-button {
            background: linear-gradient(to right, #ca8a04, #eab308, #ca8a04);
            color: #1a0b2e;
            font-weight: 700;
            transition: all 0.3s ease;
        }
        .gold-button:hover {
            background: linear-gradient(to right, #eab308, #fde047, #eab308);
            box-shadow: 0 0 20px rgba(234, 179, 8, 0.4);
        }
        .mystic-card {
            background: rgba(26, 11, 46, 0.85);
            border: 1px solid rgba(234, 179, 8, 0.3);
            border-radius: 2rem;
        }
        .flatpickr-calendar {
            background: #120521 !important;
            border: 1px solid rgba(234, 179, 8, 0.4) !important;
            border-radius: 1.5rem !important;
            color: #f8fafc !important;
            font-family: 'Prompt', sans-serif !important;
        }
        .flatpickr-day.selected {
            background: linear-gradient(to right, #ca8a04, #eab308) !important;
            color: #1a0b2e !important;
            font-weight: bold;
        }
    </style>
</head>
<body class="theme-bg text-slate-100 min-h-screen">

    <nav class="bg-[#120521]/90 border-b border-yellow-600/30 sticky top-0 z-50 backdrop-blur-md">
        <div class="max-w-6xl mx-auto px-4 py-3 flex justify-between items-center">
            <a href="index.html" class="flex items-center space-x-2">
                <span class="text-xl font-bold gold-gradient-text tracking-wider">Witchyu</span>
            </a>
            <div class="flex items-center space-x-3">
                <a href="admin.html" class="px-4 py-2 rounded-xl bg-slate-900/80 text-yellow-300 border border-yellow-600/30 text-sm font-medium">หลังบ้าน (Admin)</a>
            </div>
        </div>
    </nav>

    <main class="max-w-4xl mx-auto px-4 py-10">
        <div class="text-center space-y-3 mb-8">
            <h1 class="text-3xl md:text-4xl font-bold tracking-wide gold-gradient-text">จองคิวดูดวงพยากรณ์</h1>
        </div>

        <div id="shop-closed-banner" class="hidden bg-red-950/80 border border-red-500/50 text-red-200 p-8 rounded-2xl text-center space-y-3 shadow-xl">
            <div class="text-3xl">🚫</div>
            <h2 class="text-2xl font-bold">ขณะนี้ร้านปิดรับคิวชั่วคราว</h2>
            <p class="text-sm text-red-300">ขออภัยในความไม่สะดวก แม่หมอยังไม่เปิดรับจองคิวในขณะนี้</p>
        </div>

        <div id="booking-form-container" class="mystic-card p-6 md:p-8 space-y-6 shadow-2xl">
            <div class="space-y-4">
                <h2 class="text-lg font-semibold gold-text border-b border-yellow-600/30 pb-2">ข้อมูลผู้จอง</h2>
                <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                    <input type="text" id="client-name" placeholder="ชื่อเล่น-นามแฝง" class="w-full bg-[#120521] border border-yellow-600/30 rounded-xl px-4 py-3 text-white text-sm">
                    <input type="number" id="client-age" placeholder="อายุ" class="w-full bg-[#120521] border border-yellow-600/30 rounded-xl px-4 py-3 text-white text-sm">
                    <input type="text" id="client-status" placeholder="สถานะความสัมพันธ์ (เช่น โสด, มีแฟน)" class="w-full bg-[#120521] border border-yellow-600/30 rounded-xl px-4 py-3 text-white text-sm">
                </div>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <input type="text" id="client-phone" placeholder="เบอร์โทรศัพท์สำหรับติดต่อ" class="w-full bg-[#120521] border border-yellow-600/30 rounded-xl px-4 py-3 text-white text-sm">
                    <input type="text" id="client-ig" placeholder="Instagram หรือ ID Line" class="w-full bg-[#120521] border border-yellow-600/30 rounded-xl px-4 py-3 text-white text-sm">
                </div>
            </div>

            <div class="space-y-4">
                <h2 class="text-lg font-semibold gold-text border-b border-yellow-600/30 pb-2">เลือกแพ็กเกจคำถาม</h2>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div class="border border-yellow-600/30 p-4 rounded-xl bg-[#120521]/60 space-y-2">
                        <h3 class="font-bold text-sm gold-text">คำถามเจาะจง</h3>
                        <label class="flex items-center justify-between p-2 rounded hover:bg-yellow-950/20 cursor-pointer text-xs">
                            <span>• 1 คำถาม (29 บาท)</span>
                            <input type="radio" name="horo_package" value="คำถามเจาะจง: 1 คำถาม (29บ.)" class="accent-yellow-500">
                        </label>
                        <label class="flex items-center justify-between p-2 rounded hover:bg-yellow-950/20 cursor-pointer text-xs">
                            <span>• 3 คำถาม (79 บาท)</span>
                            <input type="radio" name="horo_package" value="คำถามเจาะจง: 3 คำถาม (79บ.)" class="accent-yellow-500">
                        </label>
                        <label class="flex items-center justify-between p-2 rounded hover:bg-yellow-950/20 cursor-pointer text-xs">
                            <span>• 5 คำถาม (129 บาท)</span>
                            <input type="radio" name="horo_package" value="คำถามเจาะจง: 5 คำถาม (129บ.)" class="accent-yellow-500">
                        </label>
                    </div>

                    <div id="phone-package-section" class="border border-yellow-600/30 p-4 rounded-xl bg-[#120521]/60 space-y-2">
                        <h3 class="font-bold text-sm gold-text">คำถามแบบโทร</h3>
                        <label class="flex items-center justify-between p-2 rounded hover:bg-yellow-950/20 cursor-pointer text-xs">
                            <span>• โทร 15 นาที (99 บาท)</span>
                            <input type="radio" name="horo_package" value="คำถามแบบโทร: 15 นาที (99บ.)" class="accent-yellow-500">
                        </label>
                        <label class="flex items-center justify-between p-2 rounded hover:bg-yellow-950/20 cursor-pointer text-xs">
                            <span>• โทร 30 นาที (129 บาท)</span>
                            <input type="radio" name="horo_package" value="คำถามแบบโทร: 30 นาที (129บ.)" class="accent-yellow-500">
                        </label>
                    </div>
                </div>
            </div>

            <div class="space-y-4">
                <h2 class="text-lg font-semibold gold-text border-b border-yellow-600/30 pb-2">เลือกวันและเวลา</h2>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div class="bg-[#120521] border border-yellow-600/40 rounded-xl p-4">
                        <label class="block text-xs text-yellow-400 mb-1">วันที่จอง</label>
                        <input type="text" id="book-date" placeholder="เลือกวันที่" class="w-full bg-[#1a0b2e] border border-yellow-600/40 rounded-lg px-3 py-2 text-white text-sm">
                        <p id="date-warning" class="text-xs text-red-400 hidden mt-1">⚠️ วันนี้ร้านปิดรับจอง</p>
                    </div>
                    <div class="bg-[#120521] border border-yellow-600/40 rounded-xl p-4">
                        <label class="block text-xs text-yellow-400 mb-1">รอบเวลา</label>
                        <select id="book-time" class="w-full bg-[#1a0b2e] border border-yellow-600/40 rounded-lg px-3 py-2 text-white text-sm"></select>
                    </div>
                </div>
                <input type="text" id="client-note" placeholder="หมายเหตุเพิ่มเติม (ถ้ามี)" class="w-full bg-[#120521] border border-yellow-600/30 rounded-xl px-4 py-3 text-white text-sm">
            </div>

            <button onclick="submitBooking()" class="w-full py-4 gold-button rounded-xl uppercase shadow-lg text-sm tracking-wider">ยืนยันการจองคิว</button>
        </div>
    </main>

    <script>
        const SUPABASE_URL = 'https://xmlvisoddzhhfvncntgv.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InhtbHZpc29kZHpoaGZ2bmNudGd2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgzODI0NTksImV4cCI6MjEwMzk1ODQ1OX0.cTnihQOyfrsddsrBm5ehmFF1tEK49YoOvGZHqxu2QjE';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let settings = {};
        let bookings = [];

        window.addEventListener('DOMContentLoaded', () => {
            flatpickr("#book-date", {
                locale: "th",
                dateFormat: "Y-m-d",
                defaultDate: "today",
                minDate: "today",
                onChange: () => updateAvailableTimes()
            });
            fetchData();
        });

        async function fetchData() {
            const { data: settingsData } = await supabaseClient.from('settings').select('*').eq('id', 1).single();
            const { data: bookingsData } = await supabaseClient.from('bookings').select('*');
            settings = settingsData || { is_shop_open: true, is_phone_allowed: true };
            bookings = bookingsData || [];
            updateUI();
        }

        function updateUI() {
            const formContainer = document.getElementById('booking-form-container');
            const closedBanner = document.getElementById('shop-closed-banner');
            if (settings.is_shop_open) {
                formContainer.classList.remove('hidden');
                closedBanner.classList.add('hidden');
            } else {
                formContainer.classList.add('hidden');
                closedBanner.classList.remove('hidden');
            }
            document.getElementById('phone-package-section').style.display = settings.is_phone_allowed ? "block" : "none";
            updateAvailableTimes();
        }

        function updateAvailableTimes() {
            const selectedDate = document.getElementById('book-date').value;
            const timeSelect = document.getElementById('book-time');
            const warningText = document.getElementById('date-warning');
            if (!selectedDate) return;

            timeSelect.innerHTML = '';
            const disabledDates = settings.disabled_dates || [];
            if (disabledDates.includes(selectedDate)) {
                warningText.classList.remove('hidden');
                timeSelect.innerHTML = '<option disabled>🚫 วันนี้ร้านปิดรับคิว</option>';
                return;
            } else {
                warningText.classList.add('hidden');
            }

            const timeSlots = settings.time_slots_config || [];
            const openSlots = timeSlots.filter(s => s.isOpen !== false);

            if (openSlots.length === 0) {
                timeSelect.innerHTML = '<option disabled>ไม่มีรอบเวลาเปิดให้บริการ</option>';
                return;
            }

            openSlots.forEach(slotObj => {
                const slot = slotObj.time;
                const isBooked = bookings.some(b => b.booking_date === selectedDate && b.booking_time === slot);
                const option = document.createElement('option');
                option.value = slot;
                if (isBooked) {
                    option.textContent = `${slot} (ถูกจองแล้ว)`;
                    option.disabled = true;
                    option.style.color = '#ef4444';
                } else {
                    option.textContent = `${slot} (ว่าง)`;
                }
                timeSelect.appendChild(option);
            });
        }

        async function submitBooking() {
            const selectedPackage = document.querySelector('input[name="horo_package"]:checked');
            const date = document.getElementById('book-date').value;
            const time = document.getElementById('book-time').value;
            const name = document.getElementById('client-name').value.trim();
            const age = document.getElementById('client-age').value.trim();
            const status = document.getElementById('client-status').value.trim();
            const phone = document.getElementById('client-phone').value.trim();
            const ig = document.getElementById('client-ig').value.trim();
            const note = document.getElementById('client-note').value.trim() || '-';

            if (!selectedPackage || !date || !time || !name || !age || !status || !phone || !ig) {
                alert('กรุณากรอกข้อมูลส่วนตัวและเลือกแพ็กเกจให้ครบถ้วนครับ');
                return;
            }

            const queueNo = "Q" + String(bookings.length + 1).padStart(3, '0');

            const { error } = await supabaseClient.from('bookings').insert([{
                queue_no: queueNo,
                master: selectedPackage.value,
                booking_date: date,
                booking_time: time,
                client_name: name,
                client_age: age,
                client_status: status,
                client_phone: phone,
                client_ig: ig,
                note: note
            }]);

            if (error) {
                alert('เกิดข้อผิดพลาดในการจอง กรุณาลองใหม่อีกครั้ง');
                return;
            }

            alert('จองคิวสำเร็จ! หมายเลขคิวของคุณคือ ' + queueNo);
            window.location.reload();
        }
    </script>
</body>
</html>
