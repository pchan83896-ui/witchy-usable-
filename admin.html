<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>หลังบ้านหมอดู - ร้าน Witch yu</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Prompt', sans-serif; }
        .theme-bg {
            background-color: #1a0b2e;
            background-image: radial-gradient(circle at 50% 20%, #2e1046 0%, #1a0b2e 70%, #0d041a 100%);
        }
        .gold-text { color: #fde047; }
        .gold-gradient-text {
            background: linear-gradient(to right, #fef08a, #fde047, #ca8a04);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .gold-button {
            background: linear-gradient(to right, #ca8a04, #eab308, #ca8a04);
            color: #1a0b2e;
            font-weight: 700;
        }
        .mystic-card {
            background: rgba(26, 11, 46, 0.85);
            border: 1px solid rgba(234, 179, 8, 0.3);
            border-radius: 2rem;
        }
    </style>
</head>
<body class="theme-bg text-slate-100 min-h-screen">

    <nav class="bg-[#120521]/90 border-b border-yellow-600/30 sticky top-0 z-50 backdrop-blur-md">
        <div class="max-w-6xl mx-auto px-4 py-4 flex justify-between items-center">
            <span class="text-xl font-bold gold-gradient-text">ระบบหลังบ้าน (Admin)</span>
            <a href="index.html" class="px-4 py-2 rounded-xl gold-button text-sm">กลับไปหน้าจองคิว 🌙</a>
        </div>
    </nav>

    <main class="max-w-5xl mx-auto px-4 py-10 space-y-6">
        <section class="bg-[#120521] p-6 rounded-2xl border border-yellow-600/30 space-y-6 shadow-xl">
            <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">
                <div>
                    <h1 class="text-xl font-bold gold-text">จัดการคิวและตั้งค่าระบบ</h1>
                    <p class="text-slate-400 text-sm">ควบคุมสถานะร้านและรอบเวลา</p>
                </div>
                <div class="flex items-center gap-3">
                    <button id="shop-status-btn" onclick="toggleShopStatus()" class="px-5 py-2.5 rounded-xl font-bold text-sm shadow-md transition"></button>
                    <button onclick="clearBookings()" class="px-4 py-2.5 bg-red-950/40 text-red-400 border border-red-600/40 rounded-xl text-sm">ล้างคิวทั้งหมด</button>
                </div>
            </div>
        </section>

        <section class="mystic-card overflow-hidden shadow-2xl">
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="bg-yellow-950/20 gold-text text-sm border-b border-yellow-600/30">
                            <th class="p-4">เลขคิว</th>
                            <th class="p-4">วัน-เวลา</th>
                            <th class="p-4">แพ็กเกจ</th>
                            <th class="p-4">ชื่อลูกค้า</th>
                            <th class="p-4">เบอร์ / IG</th>
                            <th class="p-4">หมายเหตุ</th>
                            <th class="p-4 text-center">จัดการ</th>
                        </tr>
                    </thead>
                    <tbody id="booking-list" class="divide-y divide-yellow-600/20 text-sm"></tbody>
                </table>
            </div>
        </section>
    </main>

    <script>
        const SUPABASE_URL = 'https://xmlvisoddzhhfvncntgv.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InhtbHZpc29kZHpoaGZ2bmNudGd2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgzODI0NTksImV4cCI6MjEwMzk1ODQ1OX0.cTnihQOyfrsddsrBm5ehmFF1tEK49YoOvGZHqxu2QjE';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let settings = {};
        let bookings = [];

        window.addEventListener('DOMContentLoaded', () => {
            fetchAdminData();
        });

        async function fetchAdminData() {
            const { data: settingsData } = await supabaseClient.from('settings').select('*').eq('id', 1).single();
            const { data: bookingsData } = await supabaseClient.from('bookings').select('*').order('id', { ascending: true });
            settings = settingsData || { is_shop_open: true };
            bookings = bookingsData || [];
            updateAdminUI();
        }

        function updateAdminUI() {
            const shopBtn = document.getElementById('shop-status-btn');
            if (settings.is_shop_open) {
                shopBtn.className = "px-5 py-2.5 rounded-xl font-bold text-sm bg-emerald-600 text-white";
                shopBtn.innerHTML = "🟢 ร้านเปิดอยู่ (คลิกปิด)";
            } else {
                shopBtn.className = "px-5 py-2.5 rounded-xl font-bold text-sm bg-red-600 text-white";
                shopBtn.innerHTML = "🔴 ร้านปิดอยู่ (คลิกเปิด)";
            }

            const tbody = document.getElementById('booking-list');
            tbody.innerHTML = '';
            if (bookings.length === 0) {
                tbody.innerHTML = `<tr><td colspan="7" class="p-6 text-center text-slate-500">ยังไม่มีคิวจองในระบบ</td></tr>`;
                return;
            }
            bookings.forEach(b => {
                tbody.innerHTML += `
                    <tr class="hover:bg-yellow-950/10">
                        <td class="p-4 font-bold text-yellow-400">${b.queue_no}</td>
                        <td class="p-4">${b.booking_date}<br><span class="text-xs text-yellow-300">${b.booking_time}</span></td>
                        <td class="p-4">${b.master}</td>
                        <td class="p-4">${b.client_name}</td>
                        <td class="p-4">${b.client_phone}<br><span class="text-xs text-yellow-400">${b.client_ig}</span></td>
                        <td class="p-4 text-slate-400">${b.note}</td>
                        <td class="p-4 text-center">
                            <button onclick="deleteBooking(${b.id})" class="px-3 py-1 bg-red-950 text-red-400 border border-red-600/40 rounded-lg text-xs">ลบ</button>
                        </td>
                    </tr>
                `;
            });
        }

        async function toggleShopStatus() {
            const newStatus = !settings.is_shop_open;
            await supabaseClient.from('settings').update({ is_shop_open: newStatus }).eq('id', 1);
            fetchAdminData();
        }

        async function deleteBooking(id) {
            if (confirm('คุณต้องการลบคิวนี้ใช่หรือไม่?')) {
                await supabaseClient.from('bookings').delete().eq('id', id);
                fetchAdminData();
            }
        }

        async function clearBookings() {
            if (confirm('คุณต้องการล้างข้อมูลคิวทั้งหมดใช่หรือไม่?')) {
                await supabaseClient.from('bookings').delete().neq('id', 0);
                fetchAdminData();
            }
        }
    </script>
</body>
</html>
